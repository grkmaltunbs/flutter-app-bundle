id: service-account-key-on-the-mac
title: Put a Firebase service-account key for flutterappbundle on the Mac, outside the repo
status: done
needs: [console, secret]
blocks: [notifications]
step: notifications
added: "2026-08-30"
body: |
  The host sends push notifications itself over FCM HTTP v1, which needs an
  OAuth token minted from a service-account key. The key never enters the
  repo (`.gitignore` already excludes `*service-account*.json`); it lives in
  `~/.flutter_kit/` and the host reads it from there.
runbook:
  - do: Firebase console → flutterappbundle → Project settings → Service accounts → Generate new private key.
    expect: A JSON file downloads; the console warns to keep it secret.
  - do: Move it to `~/.flutter_kit/flutterappbundle-service-account.json` and remove it from Downloads.
    expect: The file exists at that path and nowhere else.
    verify: test -s ~/.flutter_kit/flutterappbundle-service-account.json && echo ok
  - do: Firebase console → Cloud Messaging → confirm the FCM v1 API is enabled.
    expect: Firebase Cloud Messaging API (V1) shows as Enabled.
done_at: 2026-09-03
note: "Generated in the console from Claude in Chrome 2026-09-03; at ~\/.flutter_kit\/flutterappbundle-service-account.json (600), gone from Downloads; FCM v1 API shows Enabled; a probe send answered 400 about the probe token, so the key mints and FCM answers"
